<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishna</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #f5f3ef;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }
    .role {
      font-size: 1.1rem;
      color: #555;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #bbb;
      margin: 1.5rem auto;
    }
    .tagline {
      font-size: 1rem;
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Krishna</h1>
    <p class="role">Marketer at Google</p>
    <div class="divider"></div>
    <p class="tagline">Driving growth through outbound marketing.</p>
  </div>
</body>
</html>
